<!-- templates/slides/base.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #0f1117; color: #e8eaf0;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .slide {
    width: 1920px; height: 1080px; position: absolute; top: 0; left: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 80px;
    opacity: 0; transition: opacity 0.6s ease;
  }
  .slide.active { opacity: 1; }
  .fade-in { opacity: 0; transform: translateY(20px);
             transition: opacity 0.5s ease, transform 0.5s ease; }
  .fade-in.show { opacity: 1; transform: translateY(0); }
  .tag {
    font-size: 18px; letter-spacing: 4px; text-transform: uppercase;
    color: #3b82f6; margin-bottom: 24px; font-weight: 600;
  }
  .title { font-size: 72px; font-weight: 800; line-height: 1.2; text-align: center; }
  .subtitle { font-size: 32px; color: #9ca3af; margin-top: 24px; text-align: center; }
  .divider { width: 80px; height: 4px; background: #3b82f6; border-radius: 2px; margin: 32px auto; }
  .footer { position: absolute; bottom: 40px; right: 80px; font-size: 24px; color: #374151; font-weight: 600; }
  .section-title { font-size: 48px; font-weight: 800; color: #3b82f6; margin-bottom: 48px; align-self: flex-start; }
  .card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 16px; padding: 32px 40px; width: 100%; margin-bottom: 24px; }
  .card-title { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
  .card-body { font-size: 26px; color: #9ca3af; line-height: 1.6; }
  .badge { display: inline-block; font-size: 20px; font-weight: 600; padding: 6px 18px; border-radius: 8px; background: #1e3a5f; color: #60a5fa; margin-right: 12px; }
  .highlight { color: #60a5fa; font-weight: 700; }
</style>
</head>
<body>
{% block content %}{% endblock %}
<div class="footer">AILark · {{ date }}</div>
</body>
</html>
