<!-- templates/slides/papers.html -->
{% extends "base.html" %}
{% block content %}
<div class="slide active" id="papers" style="align-items:flex-start;">
  <div class="section-title fade-in">주요 논문</div>
  {% for paper in data.papers %}
  <div class="card fade-in" style="transition-delay:{{ loop.index * 0.2 }}s">
    <div class="card-title" style="font-size:28px;">{{ paper.title }}</div>
    <div class="card-body" style="margin-top:12px;">{{ paper.summary }}</div>
  </div>
  {% endfor %}
</div>
{% endblock %}
